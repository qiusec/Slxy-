<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>按键组合 GIF 生成器</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root{
      --bg1:#11161d;
      --bg2:#1a2230;
      --panel:rgba(18, 24, 32, .82);
      --text:#f4f7fb;
      --muted:#a8b3c7;
      --line:rgba(255,255,255,.12);
    }

    * { box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      padding:24px;
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(84, 103, 145, .20), transparent 28%),
        radial-gradient(circle at 85% 20%, rgba(255, 216, 90, .10), transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(87, 173, 160, .14), transparent 30%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
    }

    .app{
      width:min(1180px, 100%);
      margin:0 auto;
    }

    .header{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:22px;
      padding:20px 22px;
      margin-bottom:18px;
    }

    h1{
      margin:0;
      font-family:"Press Start 2P", monospace;
      font-size:18px;
      line-height:1.5;
      letter-spacing:.02em;
    }

    .layout{
      display:grid;
      grid-template-columns: minmax(0, 1fr) minmax(520px, 1fr);
      gap:18px;
      align-items:start;
    }

    .panel{
      min-width:0;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:22px;
      padding:18px;
    }

    .panel h2{
      margin:0 0 10px;
      font-family:"Press Start 2P", monospace;
      font-size:14px;
      line-height:1.6;
    }

    .row{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      margin:14px 0 10px;
    }

    button, a.download{
      appearance:none;
      border:none;
      cursor:pointer;
      padding:11px 15px;
      border-radius:12px;
      color:#fff;
      background:linear-gradient(180deg, #6f768d, #525968);
      box-shadow:
        0 5px 0 #20242d,
        inset 0 1px 0 rgba(255,255,255,.12);
      text-decoration:none;
      font-weight:800;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      transition:transform .08s ease, filter .08s ease;
    }

    button:hover, a.download:hover{
      filter:brightness(1.05);
    }

    button:active, a.download:active{
      transform:translateY(2px);
      box-shadow:
        0 3px 0 #20242d,
        inset 0 1px 0 rgba(255,255,255,.10);
    }

    a.hidden{ display:none; }

    .meta{
      margin-top:6px;
      font-size:13px;
      color:#dfe7f7;
      line-height:1.6;
    }

    .seq{
      margin-top:8px;
      font-family:"Press Start 2P", monospace;
      font-size:12px;
      line-height:1.8;
      word-break:break-word;
      color:#fff;
      opacity:.96;
    }

    .previewWrap{
      margin-top:14px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      padding:12px;
      overflow:hidden;
      background:
        linear-gradient(45deg, rgba(255,255,255,.10) 25%, transparent 25%) -16px 0/32px 32px,
        linear-gradient(-45deg, rgba(255,255,255,.10) 25%, transparent 25%) -16px 0/32px 32px,
        linear-gradient(45deg, transparent 75%, rgba(255,255,255,.10) 75%) -16px 0/32px 32px,
        linear-gradient(-45deg, transparent 75%, rgba(255,255,255,.10) 75%) -16px 0/32px 32px,
        rgba(11,14,18,.95);
    }

    canvas{
      display:block;
      image-rendering:pixelated;
      image-rendering:crisp-edges;
      background:transparent;
    }

    #preview{
      width:100%;
      height:auto;
      max-width:100%;
      cursor:pointer;
    }

    .watermarkTag{
      margin-top:8px;
      text-align:right;
      font-family:"Press Start 2P", monospace;
      font-size:11px;
      line-height:1;
      color:#ffffff;
      opacity:.42;
      user-select:none;
      pointer-events:none;
    }

    .controlsGrid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:12px;
      margin-top:12px;
    }

    .control{
      border-radius:16px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.09);
      padding:12px;
      min-width:0;
    }

    .control label{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      margin-bottom:10px;
      color:#dbe3f5;
      font-size:13px;
      font-weight:700;
    }

    .control input[type="color"]{
      width:100%;
      height:42px;
      padding:0;
      border:none;
      background:transparent;
      cursor:pointer;
    }

    .control input[type="range"]{
      width:100%;
      accent-color:#ffd85a;
    }

    @media (max-width: 1200px){
      .layout{
        grid-template-columns:1fr;
      }

      .controlsGrid{
        grid-template-columns:1fr 1fr;
      }
    }

    @media (max-width: 720px){
      body{ padding:16px; }
      h1{ font-size:16px; }
      .controlsGrid{
        grid-template-columns:1fr;
      }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>按键组合 GIF 生成器</h1>
    </div>

    <div class="layout">
      <div class="panel">
        <h2>输入与导出</h2>

        <div class="row">
          <button id="clearBtn">清空</button>
          <button id="exportBtn">生成 GIF</button>
          <a id="downloadLink" class="download hidden" download="keys.gif">下载 GIF</a>
        </div>

        <div class="meta" id="status">等待输入...</div>
        <div class="seq" id="seqText">(空)</div>

        <div class="previewWrap">
          <canvas id="preview" width="900" height="280"></canvas>
        </div>

        <div class="watermarkTag">xy</div>
      </div>

      <div class="panel">
        <h2>颜色</h2>

        <div class="controlsGrid">
          <div class="control">
            <label>键帽主体色 <span id="bodyColorVal"></span></label>
            <input type="color" id="bodyColor" value="#5b6278" />
          </div>

          <div class="control">
            <label>顶部高光色 <span id="topColorVal"></span></label>
            <input type="color" id="topColor" value="#8188a0" />
          </div>

          <div class="control">
            <label>底座颜色 <span id="baseColorVal"></span></label>
            <input type="color" id="baseColor" value="#3f4556" />
          </div>

          <div class="control">
            <label>文字颜色 <span id="textColorVal"></span></label>
            <input type="color" id="textColor" value="#f7f8fc" />
          </div>

          <div class="control">
            <label>加号颜色 <span id="plusColorVal"></span></label>
            <input type="color" id="plusColor" value="#ffd85a" />
          </div>

          <div class="control">
            <label>按下位移强度 <span id="pressOffsetVal"></span></label>
            <input type="range" id="pressOffset" min="4" max="14" step="1" value="8" />
          </div>

          <div class="control">
            <label>按下频率 <span id="pressFreqVal"></span></label>
            <input type="range" id="pressFreq" min="0.8" max="8" step="0.1" value="2.0" />
          </div>
        </div>
      </div>
    </div>

    <canvas id="exportCanvas" style="display:none;"></canvas>
  </div>

  <script>
    const keys = [];

    const EXPORT_W = 900;
    const EXPORT_H = 280;

    // 透明键色：尽量接近黑色，减少 GIF 边缘脏边
    const TRANSPARENT_KEY_HEX = '#010101';
    const TRANSPARENT_KEY = 0x010101;

    const previewCanvas = document.getElementById('preview');
    const previewCtx = previewCanvas.getContext('2d');

    const exportCanvas = document.getElementById('exportCanvas');
    const exportCtx = exportCanvas.getContext('2d');

    const clearBtn = document.getElementById('clearBtn');
    const exportBtn = document.getElementById('exportBtn');
    const downloadLink = document.getElementById('downloadLink');
    const statusEl = document.getElementById('status');
    const seqText = document.getElementById('seqText');

    const bodyColor = document.getElementById('bodyColor');
    const topColor = document.getElementById('topColor');
    const baseColor = document.getElementById('baseColor');
    const textColor = document.getElementById('textColor');
    const plusColor = document.getElementById('plusColor');
    const pressOffset = document.getElementById('pressOffset');
    const pressFreq = document.getElementById('pressFreq');

    const bodyColorVal = document.getElementById('bodyColorVal');
    const topColorVal = document.getElementById('topColorVal');
    const baseColorVal = document.getElementById('baseColorVal');
    const textColorVal = document.getElementById('textColorVal');
    const plusColorVal = document.getElementById('plusColorVal');
    const pressOffsetVal = document.getElementById('pressOffsetVal');
    const pressFreqVal = document.getElementById('pressFreqVal');

    const cfg = {
      canvasW: EXPORT_W,
      canvasH: EXPORT_H,
      keyH: 104,
      gap: 16,
      plusGap: 14,
      marginX: 24,
      font: '"Press Start 2P", monospace'
    };

    const state = {
      body: bodyColor.value,
      top: topColor.value,
      base: baseColor.value,
      text: textColor.value,
      plus: plusColor.value,
      pressOffset: +pressOffset.value,
      pressFreq: +pressFreq.value
    };

    function syncLabels(){
      bodyColorVal.textContent = state.body;
      topColorVal.textContent = state.top;
      baseColorVal.textContent = state.base;
      textColorVal.textContent = state.text;
      plusColorVal.textContent = state.plus;
      pressOffsetVal.textContent = String(state.pressOffset);
      pressFreqVal.textContent = `${state.pressFreq.toFixed(1)} 次/秒`;
    }

    function normalizeKey(e){
      const k = e.key;

      if (k === ' ') return 'SPACE';
      if (k === 'Escape') return 'ESC';
      if (k === 'Backspace') return 'BACK';
      if (k === 'Enter') return 'ENTER';
      if (k === 'Tab') return 'TAB';
      if (k === 'ArrowUp') return '↑';
      if (k === 'ArrowDown') return '↓';
      if (k === 'ArrowLeft') return '←';
      if (k === 'ArrowRight') return '→';
      if (k === 'Shift') return 'SHIFT';
      if (k === 'Control') return 'CTRL';
      if (k === 'Alt') return 'ALT';
      if (k === 'Meta') return 'WIN';
      if (k === 'CapsLock') return 'CAPS';
      if (k === 'Delete') return 'DEL';

      if (k.length === 1) return k.toUpperCase();
      return k.toUpperCase();
    }

    function normalizeMouseButton(e){
      if (e.button === 0) return 'LMB';
      if (e.button === 2) return 'RMB';
      if (e.button === 3) return 'X1';
      if (e.button === 4) return 'X2';
      return null;
    }

    function displayLabel(label){
      if (label === '`') return '~';
      return label;
    }

    function isMouseLabel(label){
      return label === 'LMB' || label === 'RMB' || label === 'X1' || label === 'X2';
    }

    function shadeColor(hex, percent){
      const num = parseInt(hex.replace('#',''), 16);
      let r = (num >> 16) & 255;
      let g = (num >> 8) & 255;
      let b = num & 255;

      r = Math.max(0, Math.min(255, Math.round(r + (255 * percent / 100))));
      g = Math.max(0, Math.min(255, Math.round(g + (255 * percent / 100))));
      b = Math.max(0, Math.min(255, Math.round(b + (255 * percent / 100))));

      return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
    }

    function roundRect(ctx, x, y, w, h, r){
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function isArrow(label){
      return label === '←' || label === '→' || label === '↑' || label === '↓';
    }

    function measureKeyWidth(ctx, label, scale = 1){
      const l = displayLabel(label);

      if (isMouseLabel(l)) return 104 * scale;
      if (isArrow(l)) return 96 * scale;
      if (l === 'SPACE') return 128 * scale;

      ctx.save();
      ctx.font = `${18 * scale}px ${cfg.font}`;
      const textW = ctx.measureText(l).width;
      ctx.restore();

      return Math.max(80 * scale, Math.min(180 * scale, Math.ceil(textW + 44 * scale)));
    }

    function fitKeyFont(ctx, label, maxWidth, scale = 1){
      for (let size = 22; size >= 10; size--) {
        ctx.font = `${size * scale}px ${cfg.font}`;
        if (ctx.measureText(label).width <= maxWidth) return size * scale;
      }
      return 10 * scale;
    }

    function drawArrowIcon(ctx, dir, cx, cy, size, scale = 1){
      const shaft = Math.max(5, 6 * scale);
      const head = Math.max(14, 16 * scale);
      const len = size;

      const tailLen = len * 0.34;
      const headInset = len * 0.12;

      ctx.save();
      ctx.fillStyle = state.text;

      if (dir === '←') {
        ctx.fillRect(cx - len * 0.02, cy - shaft / 2, tailLen, shaft);
        ctx.beginPath();
        ctx.moveTo(cx - len * 0.40, cy);
        ctx.lineTo(cx - headInset, cy - head * 0.62);
        ctx.lineTo(cx - headInset, cy - shaft * 1.20);
        ctx.lineTo(cx - headInset, cy + shaft * 1.20);
        ctx.lineTo(cx - headInset, cy + head * 0.62);
        ctx.closePath();
        ctx.fill();
      } else if (dir === '→') {
        ctx.fillRect(cx - tailLen - len * 0.02, cy - shaft / 2, tailLen, shaft);
        ctx.beginPath();
        ctx.moveTo(cx + len * 0.40, cy);
        ctx.lineTo(cx + headInset, cy - head * 0.62);
        ctx.lineTo(cx + headInset, cy - shaft * 1.20);
        ctx.lineTo(cx + headInset, cy + shaft * 1.20);
        ctx.lineTo(cx + headInset, cy + head * 0.62);
        ctx.closePath();
        ctx.fill();
      } else if (dir === '↑') {
        ctx.fillRect(cx - shaft / 2, cy - len * 0.02, shaft, tailLen);
        ctx.beginPath();
        ctx.moveTo(cx, cy - len * 0.40);
        ctx.lineTo(cx - head * 0.62, cy - headInset);
        ctx.lineTo(cx - shaft * 1.20, cy - headInset);
        ctx.lineTo(cx + shaft * 1.20, cy - headInset);
        ctx.lineTo(cx + head * 0.62, cy - headInset);
        ctx.closePath();
        ctx.fill();
      } else if (dir === '↓') {
        ctx.fillRect(cx - shaft / 2, cy - tailLen - len * 0.02, shaft, tailLen);
        ctx.beginPath();
        ctx.moveTo(cx, cy + len * 0.40);
        ctx.lineTo(cx - head * 0.62, cy + headInset);
        ctx.lineTo(cx - shaft * 1.20, cy + headInset);
        ctx.lineTo(cx + shaft * 1.20, cy + headInset);
        ctx.lineTo(cx + head * 0.62, cy + headInset);
        ctx.closePath();
        ctx.fill();
      }

      ctx.restore();
    }

    function drawMouseIcon(ctx, label, x, y, w, h, scale = 1){
      const bodyW = Math.min(68 * scale, w - 10 * scale);
      const bodyH = Math.min(96 * scale, h - 4 * scale);
      const bx = x + (w - bodyW) / 2;
      const by = y + (h - bodyH) / 2 - 1 * scale;

      const body = state.body;
      const top = state.top;
      const base = state.base;
      const text = state.text;

      const shadow = 'rgba(0,0,0,.30)';
      const deepBase = shadeColor(base, -18);
      const sideDark = shadeColor(base, -12);
      const innerDark = shadeColor(base, -8);
      const topLight = shadeColor(top, 10);
      const rimLight = shadeColor(top, 18);

      ctx.save();

      // 底部厚影
      ctx.fillStyle = shadow;
      roundRect(ctx, bx + 3 * scale, by + 10 * scale, bodyW, bodyH, 18 * scale);
      ctx.fill();

      // 底座厚边（可调色）
      ctx.fillStyle = deepBase;
      roundRect(ctx, bx, by + 4 * scale, bodyW, bodyH - 2 * scale, 18 * scale);
      ctx.fill();

      // 主体正面
      ctx.fillStyle = body;
      roundRect(ctx, bx, by, bodyW, bodyH - 4 * scale, 18 * scale);
      ctx.fill();

      // 顶部面板
      ctx.fillStyle = top;
      roundRect(ctx, bx + 6 * scale, by + 4 * scale, bodyW - 12 * scale, 12 * scale, 6 * scale);
      ctx.fill();

      // 顶部亮边
      ctx.fillStyle = rimLight;
      ctx.fillRect(
        Math.round(bx + 8 * scale),
        Math.round(by + 3 * scale),
        Math.round(bodyW - 16 * scale),
        Math.round(2 * scale)
      );

      // 左侧边缘一点点亮边
      ctx.fillStyle = topLight;
      ctx.fillRect(
        Math.round(bx + 2 * scale),
        Math.round(by + 6 * scale),
        Math.round(2 * scale),
        Math.round(bodyH - 12 * scale)
      );

      // 右侧和下方阴影收边
      ctx.fillStyle = sideDark;
      ctx.fillRect(
        Math.round(bx + bodyW - 4 * scale),
        Math.round(by + 4 * scale),
        Math.round(2 * scale),
        Math.round(bodyH - 8 * scale)
      );
      ctx.fillRect(
        Math.round(bx + 6 * scale),
        Math.round(by + bodyH - 9 * scale),
        Math.round(bodyW - 12 * scale),
        Math.round(5 * scale)
      );

      // 左右分区线
      ctx.fillStyle = innerDark;
      ctx.fillRect(
        Math.round(bx + bodyW / 2 - 1 * scale),
        Math.round(by + 7 * scale),
        Math.round(2 * scale),
        Math.round(28 * scale)
      );

      // 左键/右键局部高光
      if (label === 'LMB') {
        ctx.fillStyle = topLight;
        roundRect(ctx, bx + 4 * scale, by + 5 * scale, bodyW / 2 - 7 * scale, 24 * scale, 9 * scale);
        ctx.fill();
      }

      if (label === 'RMB') {
        ctx.fillStyle = topLight;
        roundRect(ctx, bx + bodyW / 2 + 3 * scale, by + 5 * scale, bodyW / 2 - 7 * scale, 24 * scale, 9 * scale);
        ctx.fill();
      }

      // 滚轮
      ctx.fillStyle = text;
      roundRect(ctx, bx + bodyW / 2 - 2 * scale, by + 20 * scale, 4 * scale, 14 * scale, 2 * scale);
      ctx.fill();

      // 滚轮阴影
      ctx.fillStyle = sideDark;
      ctx.fillRect(
        Math.round(bx + bodyW / 2 - 3 * scale),
        Math.round(by + 19 * scale),
        Math.round(6 * scale),
        Math.round(1.5 * scale)
      );
      ctx.fillRect(
        Math.round(bx + bodyW / 2 - 3 * scale),
        Math.round(by + 34 * scale),
        Math.round(6 * scale),
        Math.round(1.5 * scale)
      );

      // 左右侧按键小块
      if (label === 'X1') {
        ctx.fillStyle = topLight;
        roundRect(ctx, bx - 5 * scale, by + 28 * scale, 8 * scale, 11 * scale, 3 * scale);
        ctx.fill();
      }

      if (label === 'X2') {
        ctx.fillStyle = topLight;
        roundRect(ctx, bx + bodyW - 3 * scale, by + 28 * scale, 8 * scale, 11 * scale, 3 * scale);
        ctx.fill();
      }

      // 下方文字变大一点
      ctx.fillStyle = text;
      ctx.font = `${14 * scale}px ${cfg.font}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(label, x + w / 2, by + bodyH + 1 * scale);

      ctx.restore();
    }

    function computeLayout(ctx, labels){
      const widths = labels.map(l => measureKeyWidth(ctx, l, 1));
      const plusW = labels.length > 1 ? (labels.length - 1) * (22 + cfg.plusGap) : 0;
      const keyW = widths.reduce((a, b) => a + b, 0);
      const gaps = labels.length > 1 ? (labels.length - 1) * cfg.gap : 0;
      const naturalGroupW = keyW + gaps + plusW;

      const maxW = cfg.canvasW - cfg.marginX * 2;
      let scale = naturalGroupW > 0 ? Math.min(1, maxW / naturalGroupW) : 1;

      if (labels.length > 1) scale = Math.min(scale, 0.92);
      scale = Math.max(scale, labels.length > 1 ? 0.48 : 1);

      return {
        widths,
        scale,
        scaledGroupW: naturalGroupW * scale,
        keyH: cfg.keyH * scale
      };
    }

    function drawPlus(ctx, x, y, scale){
      const s = 22 * scale;

      ctx.save();
      ctx.fillStyle = state.plus;
      ctx.font = `${22 * scale}px ${cfg.font}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('+', x + s / 2 + 1 * scale, y + s / 2 + 1 * scale);
      ctx.restore();
    }

    function drawKey(ctx, x, y, w, h, label, pressed = false, scale = 1){
      const yy = pressed ? y + state.pressOffset * scale : y;
      const topH = h - (pressed ? 18 * scale : 22 * scale);
      const display = displayLabel(label);

      if (isMouseLabel(display)) {
        drawMouseIcon(ctx, display, x, yy, w, h, scale);
        return;
      }

      ctx.save();
      roundRect(ctx, x, yy, w, h, 14 * scale);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#222734';
      roundRect(ctx, x, yy + 8 * scale, w, h - 8 * scale, 12 * scale);
      ctx.fill();

      ctx.fillStyle = pressed ? shadeColor(state.body, -8) : state.body;
      roundRect(ctx, x + 5 * scale, yy + 5 * scale, w - 10 * scale, topH, 12 * scale);
      ctx.fill();

      ctx.fillStyle = pressed ? shadeColor(state.top, 8) : state.top;
      roundRect(ctx, x + 10 * scale, yy + 1 * scale, w - 20 * scale, 6 * scale, 3 * scale);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,.14)';
      ctx.fillRect(x + 5 * scale, yy + 5 * scale, w - 18 * scale, 2 * scale);

      ctx.fillStyle = 'rgba(255,255,255,.12)';
      ctx.fillRect(x + 5 * scale, yy + 5 * scale, 2 * scale, topH - 12 * scale);

      ctx.fillStyle = '#151922';
      ctx.fillRect(x + 5 * scale, yy + topH - 5 * scale, w - 10 * scale, 5 * scale);

      ctx.fillStyle = '#10141a';
      ctx.fillRect(x + w - 10 * scale, yy + 5 * scale, 5 * scale, h - 10 * scale);

      ctx.fillStyle = state.text;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (isArrow(display)) {
        drawArrowIcon(ctx, display, x + w / 2, yy + topH / 2 + 1 * scale, Math.min(w, topH) * 0.76, scale);
      } else {
        const fontSize = fitKeyFont(ctx, display, w - 26 * scale, scale);
        ctx.font = `${fontSize}px ${cfg.font}`;
        ctx.fillText(display, x + w / 2, yy + topH / 2 + 2 * scale);
      }
    }

    function paintBackground(ctx, canvas, isExport){
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (isExport) {
        ctx.fillStyle = TRANSPARENT_KEY_HEX;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function renderCombo(ctx, canvas, labels, activeIndex = -1, pressed = false, isExport = false){
      const { widths, scale, scaledGroupW, keyH } = computeLayout(ctx, labels);

      canvas.width = cfg.canvasW;
      canvas.height = cfg.canvasH;

      paintBackground(ctx, canvas, isExport);

      if (!labels.length) return;

      const startX = Math.round((canvas.width - scaledGroupW) / 2);
      const startY = Math.round((canvas.height - keyH) / 2);

      let x = startX;

      for (let i = 0; i < labels.length; i++) {
        const w = widths[i] * scale;
        const shouldPress = pressed && i === activeIndex;
        drawKey(ctx, x, startY, w, keyH, labels[i], shouldPress, scale);
        x += w;

        if (i < labels.length - 1) {
          x += cfg.gap * scale;
          drawPlus(ctx, x, startY + 39 * scale, scale);
          x += 22 * scale + cfg.plusGap * scale;
        }
      }
    }

    function renderPreview(activeIndex = -1, pressed = false){
      renderCombo(previewCtx, previewCanvas, keys, activeIndex, pressed, false);

      if (!keys.length) {
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        previewCtx.fillStyle = 'rgba(255,255,255,.92)';
        previewCtx.font = `18px ${cfg.font}`;
        previewCtx.textAlign = 'center';
        previewCtx.textBaseline = 'middle';
        previewCtx.fillText('PRESS KEYS TO START', previewCanvas.width / 2, previewCanvas.height / 2);
        seqText.textContent = '(空)';
        statusEl.textContent = '等待输入...';
      } else {
        seqText.textContent = keys.join(' + ');
        statusEl.textContent = `已记录 ${keys.length} 个按键。`;
      }

      syncLabels();
    }

    function pushKey(label){
      if (!label) return;
      keys.push(label);
      renderPreview(keys.length - 1, true);
    }

    function popKey(){
      keys.pop();
      renderPreview(Math.max(0, keys.length - 1), false);
    }

    function clearAll(){
      keys.length = 0;
      downloadLink.classList.add('hidden');
      downloadLink.removeAttribute('href');
      renderPreview();
    }

    function buildLoopFrames(n){
      const step = Math.max(35, Math.round(1000 / (state.pressFreq * 4)));

      if (n === 1) {
        return [
          { activeIndex: 0, pressed: false, delay: step },
          { activeIndex: 0, pressed: true,  delay: step },
          { activeIndex: 0, pressed: false, delay: step },
          { activeIndex: 0, pressed: true,  delay: step },
          { activeIndex: 0, pressed: false, delay: step * 2 }
        ];
      }

      const frames = [];
      frames.push({ activeIndex: 0, pressed: false, delay: step });

      for (let i = 0; i < n; i++) {
        frames.push({ activeIndex: i, pressed: true,  delay: step });
        frames.push({ activeIndex: i, pressed: false, delay: step });
      }

      frames.push({ activeIndex: 0, pressed: false, delay: step });
      return frames;
    }

    async function loadWorkerUrl(){
      try {
        const localRes = await fetch('./gif.worker.js', { cache: 'no-store' });
        if (localRes.ok) {
          const txt = await localRes.text();
          return URL.createObjectURL(new Blob([txt], { type: 'application/javascript' }));
        }
      } catch (e) {}

      const cdn = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';
      const res = await fetch(cdn, { cache: 'no-store' });
      if (!res.ok) throw new Error('worker 加载失败');
      const text = await res.text();
      return URL.createObjectURL(new Blob([text], { type: 'application/javascript' }));
    }

    async function exportGif(){
      if (!keys.length) {
        statusEl.textContent = '先按几个键再导出。';
        return;
      }

      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }

      statusEl.textContent = '正在生成 GIF... 0%';
      downloadLink.classList.add('hidden');

      let workerScript;
      try {
        workerScript = await loadWorkerUrl();
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'worker 加载失败。请把 gif.worker.js 放到同目录，并用本地服务器打开。';
        return;
      }

      const gif = new GIF({
        workers: 1,
        quality: 8,
        repeat: 0,
        workerScript,
        transparent: TRANSPARENT_KEY,
        background: TRANSPARENT_KEY
      });

      const frames = buildLoopFrames(keys.length);

      for (const frame of frames) {
        renderCombo(exportCtx, exportCanvas, keys, frame.activeIndex, frame.pressed, true);
        gif.addFrame(exportCanvas, {
          copy: true,
          delay: frame.delay,
          dispose: 2
        });
      }

      gif.on('progress', (p) => {
        statusEl.textContent = `正在生成 GIF... ${Math.round(p * 100)}%`;
      });

      gif.on('finished', (blob) => {
        const url = URL.createObjectURL(blob);
        downloadLink.href = url;
        downloadLink.download = 'keys-transparent.gif';
        downloadLink.textContent = '下载 GIF';
        downloadLink.classList.remove('hidden');
        statusEl.textContent = 'GIF 已生成，可以下载了。';
      });

      requestAnimationFrame(() => {
        try {
          gif.render();
        } catch (err) {
          console.error(err);
          statusEl.textContent = 'GIF 生成失败。请检查 worker 是否可加载。';
        }
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.repeat) return;

      const label = normalizeKey(e);

      if (label === 'BACK') {
        e.preventDefault();
        popKey();
        return;
      }

      if (label === 'ESC') {
        e.preventDefault();
        clearAll();
        return;
      }

      if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        exportGif();
        return;
      }

      pushKey(label);

      if ([
        'SPACE','TAB','↑','↓','←','→','ENTER',
        'SHIFT','CTRL','ALT','WIN',
        'CAPS','DEL'
      ].includes(label) || label.length === 1) {
        e.preventDefault();
      }
    });

    previewCanvas.addEventListener('mousedown', (e) => {
      const label = normalizeMouseButton(e);
      if (!label) return;

      e.preventDefault();
      e.stopPropagation();
      pushKey(label);
    });

    previewCanvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    previewCanvas.addEventListener('auxclick', (e) => {
      e.preventDefault();
    });

    clearBtn.addEventListener('click', clearAll);
    exportBtn.addEventListener('click', exportGif);

    [
      bodyColor, topColor, baseColor, textColor, plusColor,
      pressOffset, pressFreq
    ].forEach(el => {
      el.addEventListener('input', () => {
        state.body = bodyColor.value;
        state.top = topColor.value;
        state.base = baseColor.value;
        state.text = textColor.value;
        state.plus = plusColor.value;
        state.pressOffset = +pressOffset.value;
        state.pressFreq = +pressFreq.value;
        renderPreview(Math.max(0, keys.length - 1), false);
      });
    });

    syncLabels();
    renderPreview();
  </script>
</body>
</html>
